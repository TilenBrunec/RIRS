name: tmp-diag
on: pull_request
permissions:
  actions: read
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: frontend-build
          run-id: 45059017912
          github-token: ${{ github.token }}
          path: art
      - env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          mkdir site && tar -xzf art/frontend-build.tgz -C site && cd site
          npx --yes vercel@50 deploy --prebuilt --prod --debug --token="$VERCEL_TOKEN" 2>&1 | grep -iE "GET |POST |status|error|Production" | grep -v Authorization | head -40
